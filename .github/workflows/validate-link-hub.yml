name: Validate Link Hub and portfolio

on:
  pull_request:
    branches: [master]
  push:
    branches: [feature/link-hub-v2-editorial]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL: "1"
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_SITE_URL: https://nebiyumekonnen.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Theme registry regression checks
        run: node scripts/test-link-hub-themes.cjs
      - name: Production build
        run: npm run build
