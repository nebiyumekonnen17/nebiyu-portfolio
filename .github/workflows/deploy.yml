name: Redirect old portfolio to new domain
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://nebiyumekonnen17.github.io/nebiyu-portfolio/
    steps:
      - name: Generate permanent redirect landing page
        shell: bash
        run: |
          mkdir -p out
          cat > out/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="robots" content="noindex,follow">
              <meta http-equiv="refresh" content="0;url=https://nebiyumekonnen.com/">
              <link rel="canonical" href="https://nebiyumekonnen.com/">
              <title>Moved to nebiyumekonnen.com</title>
              <script>window.location.replace("https://nebiyumekonnen.com/" + window.location.search + window.location.hash);</script>
            </head>
            <body><p>This portfolio moved to <a href="https://nebiyumekonnen.com/">nebiyumekonnen.com</a>.</p></body>
          </html>
          EOF
          cp out/index.html out/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload redirect
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
      - name: Publish redirect
        id: deployment
        uses: actions/deploy-pages@v4
